# daybyword.com on the owner's host (BUILD.md PM.18, docs/deploy.md): the web
# server and PostgreSQL 18 in their own Compose project, the database on an
# internal network with no host port, the web published on loopback only for
# the host's Caddy. Run from the release directory with the root-owned env
# file:
#
#   docker compose -f deploy/compose.yaml --env-file /srv/www/daybyword.com/shared/env up -d
#
# The env file holds POSTGRES_PASSWORD, DBW_APP_PASSWORD and
# DBW_MIGRATE_PASSWORD (hex, never committed); deploy/bin/*.sh set
# DBW_RELEASE, the image tag, from the release being deployed or serving.
name: ${DBW_PROJECT:-daybyword}

services:
  postgres:
    image: postgres:18.6@sha256:e3d24f6906d0760bf4da0dae872415391ededefad23fd471c47dc53b0ddf3c42
    restart: unless-stopped
    environment:
      POSTGRES_DB: daybyword
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in the env file}
      DBW_APP_PASSWORD: ${DBW_APP_PASSWORD:?set in the env file}
      DBW_MIGRATE_PASSWORD: ${DBW_MIGRATE_PASSWORD:?set in the env file}
    volumes:
      # PostgreSQL 18's images keep their data under /var/lib/postgresql/18.
      - postgres-data:/var/lib/postgresql
      - ../web/db/roles.sql:/etc/daybyword/roles.sql:ro
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-daybyword.sh:ro
    networks: [database]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-d", "daybyword"]
      interval: 5s
      timeout: 5s
      retries: 20
    shm_size: 128m
    stop_grace_period: 30s
    logging: &logging
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  web:
    image: daybyword-web:${DBW_RELEASE:?set in the env file}
    restart: unless-stopped
    environment:
      DBW_DATABASE_URL: postgresql://daybyword_app:${DBW_APP_PASSWORD}@postgres:5432/daybyword
    ports:
      - "127.0.0.1:${DBW_PORT:-4318}:3000"
    networks: [database, web]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 256
    stop_grace_period: 15s
    logging: *logging

  # One-shot jobs, run by deploy/bin/deploy.sh: apply the reviewed
  # migrations, then import the release's catalog, as daybyword_migrate.
  migrate:
    image: daybyword-web:${DBW_RELEASE:?set in the env file}
    profiles: [jobs]
    command:
      - sh
      - -c
      - node scripts/db-migrate.ts && node scripts/catalog-import.ts /app/catalog/catalog-export.json
    environment:
      DBW_DATABASE_URL: postgresql://daybyword_migrate:${DBW_MIGRATE_PASSWORD}@postgres:5432/daybyword
    networks: [database]
    depends_on:
      postgres: { condition: service_healthy }
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: *logging

volumes:
  postgres-data:
    name: ${DBW_PROJECT:-daybyword}_postgres_data

networks:
  # No route out and no host port: only this project's containers reach it.
  database:
    internal: true
  web: {}
