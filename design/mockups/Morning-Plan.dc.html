<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning · Plan page</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
</style>
</helmet>
<div style="width: 3580px; height: 1000px; box-sizing: border-box; padding: 40px; background: #ECECEA; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; gap: 40px; align-items: flex-start">

<sc-for list="{{phones}}" as="t" hint-placeholder-count="2">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 15px; font-weight: 600; color: #3A3A3A">Phone · {{t.label}}</figcaption>
<div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; box-sizing: border-box; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column">
  <header style="padding: 54px 12px 4px; display: flex; justify-content: space-between; align-items: center">
    <a href="#plans" style="min-height: 44px; display: flex; align-items: center; padding: 0 10px; text-decoration: none; font-size: 17px; font-weight: 600; color: {{t.dawn}}">‹ Plans</a>
    <button type="button" aria-label="Share" style="width: 44px; height: 44px; border-radius: 22px; border: 1px dashed {{t.muted}}; background: transparent; color: {{t.muted}}; font-size: 9px">icon</button>
  </header>
  <main style="flex-grow: 1; overflow: hidden; padding: 4px 20px; display: flex; flex-direction: column; gap: 14px">
    <div role="img" aria-label="Plan image placeholder" style="height: 92px; border: 1px dashed {{t.muted}}; border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 13px; color: {{t.muted}}">Plan image · supplied by the owner</div>
    <div>
      <p style="margin: 0; font-size: 14px; font-weight: 600; color: {{t.muted}}">A Day by Word plan · Version 1</p>
      <h1 style="margin: 4px 0 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.15">Gospels at your pace</h1>
    </div>
    <p style="margin: 0; font-size: 16px; line-height: 1.5">Matthew, Mark, Luke, and John in readings of about the same length. Read whenever you read; your next reading waits for you.</p>
    <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px">
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 12px 14px"><p style="margin: 0; font-size: 13px; color: {{t.muted}}">Each reading</p><p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">About 6 min</p></div>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 12px 14px"><p style="margin: 0; font-size: 13px; color: {{t.muted}}">Readings</p><p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">[n]</p></div>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 12px 14px"><p style="margin: 0; font-size: 13px; color: {{t.muted}}">Covers</p><p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">The four Gospels</p></div>
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 18px; padding: 12px 14px"><p style="margin: 0; font-size: 13px; color: {{t.muted}}">Schedule</p><p style="margin: 2px 0 0; font-size: 16px; font-weight: 600">At my pace</p></div>
    </div>
    <section aria-labelledby="mweek-{{t.key}}" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 20px; padding: 12px 16px">
      <h2 id="mweek-{{t.key}}" style="margin: 0 0 4px; font-size: 15px; font-weight: 700">A sample week</h2>
      <ol style="margin: 0; padding: 0; list-style: none">
        <sc-for list="{{phoneWeek}}" as="w" hint-placeholder-count="4">
        <li style="display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; font-size: 15px"><span style="color: {{t.muted}}">{{w.n}}</span><span style="font-weight: 600">{{w.ref}}</span></li>
        </sc-for>
      </ol>
    </section>
  </main>
  <div style="padding: 12px 20px 30px">
    <button type="button" style="width: 100%; min-height: 52px; border-radius: 26px; border: 0; background: {{t.dawn}}; color: {{t.onDawn}}; font: 600 17px system-ui, sans-serif">Start this plan</button>
  </div>
</div>
</figure>
</sc-for>

<sc-for list="{{desks}}" as="t" hint-placeholder-count="2">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 15px; font-weight: 600; color: #3A3A3A">Desktop · {{t.label}}</figcaption>
<div style="width: 1280px; height: 860px; border-radius: 12px; overflow: hidden; box-sizing: border-box; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column">
  <header>
    <div style="max-width: 1120px; margin: 0 auto; padding: 22px 40px; display: flex; justify-content: space-between; align-items: center">
      <a href="#home" style="display: flex; align-items: center; gap: 12px; text-decoration: none"><span aria-hidden="true" style="width: 30px; height: 30px; border: 1px dashed {{t.muted}}; border-radius: 9px"></span><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Day by Word</span></a>
      <nav aria-label="Sections" style="display: flex; gap: 6px; font-size: 15px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 24px; padding: 4px">
        <a href="#today" style="text-decoration: none; color: {{t.muted}}; padding: 9px 18px">Today</a>
        <a href="#plans" aria-current="page" style="text-decoration: none; font-weight: 600; padding: 9px 18px; border-radius: 20px; background: {{t.tint}}">Plans</a>
        <a href="#progress" style="text-decoration: none; color: {{t.muted}}; padding: 9px 18px">Progress</a>
        <a href="#settings" style="text-decoration: none; color: {{t.muted}}; padding: 9px 18px">Settings</a>
      </nav>
    </div>
  </header>
  <main style="flex-grow: 1; overflow: hidden; width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 20px 40px; display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 36px; align-items: start">
    <div style="display: flex; flex-direction: column; gap: 18px">
      <a href="#plans" style="font-size: 15px; font-weight: 600; color: {{t.dawn}}; text-decoration: none">‹ All plans</a>
      <div role="img" aria-label="Plan image placeholder" style="height: 150px; border: 1px dashed {{t.muted}}; border-radius: 28px; display: flex; align-items: center; justify-content: center; font-size: 14px; color: {{t.muted}}">Plan image · supplied by the owner (D19)</div>
      <div>
        <p style="margin: 0; font-size: 15px; font-weight: 600; color: {{t.muted}}">A Day by Word plan · Version 1</p>
        <h1 style="margin: 4px 0 0; font-size: 46px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.1">Gospels at your pace</h1>
      </div>
      <p style="margin: 0; font-size: 19px; line-height: 1.55; max-width: 640px">Matthew, Mark, Luke, and John in readings of about the same length. Read whenever you read; if you miss a day, nothing is lost, and your next reading waits for you.</p>
      <section aria-labelledby="dmweek-{{t.key}}" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 28px; padding: 20px 26px">
        <h2 id="dmweek-{{t.key}}" style="margin: 0 0 6px; font-size: 17px; font-weight: 700">A sample week</h2>
        <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 32px">
          <sc-for list="{{week}}" as="w" hint-placeholder-count="6">
          <li style="display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; font-size: 16px"><span style="color: {{t.muted}}">{{w.n}}</span><span style="font-weight: 600">{{w.ref}}</span></li>
          </sc-for>
        </ol>
      </section>
    </div>
    <aside style="display: flex; flex-direction: column; gap: 16px; padding-top: 38px">
      <div style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 28px; padding: 26px; display: flex; flex-direction: column; gap: 16px">
        <dl style="margin: 0; display: grid; grid-template-columns: 112px 1fr; gap: 10px 12px; font-size: 15px; line-height: 1.4">
          <dt style="color: {{t.muted}}">Readings</dt><dd style="margin: 0; font-weight: 600">[n] readings</dd>
          <dt style="color: {{t.muted}}">Each reading</dt><dd style="margin: 0; font-weight: 600">About 6 minutes. Estimates vary.</dd>
          <dt style="color: {{t.muted}}">Covers</dt><dd style="margin: 0; font-weight: 600">The four Gospels, every verse once</dd>
          <dt style="color: {{t.muted}}">Schedule</dt><dd style="margin: 0; font-weight: 600">Continue at my pace</dd>
          <dt style="color: {{t.muted}}">Suits</dt><dd style="margin: 0; font-weight: 600">Starting out, or coming back to the Gospels</dd>
        </dl>
        <button type="button" style="min-height: 52px; border-radius: 26px; border: 0; background: {{t.dawn}}; color: {{t.onDawn}}; font: 600 17px system-ui, sans-serif">Start this plan</button>
        <button type="button" style="min-height: 46px; border-radius: 23px; border: 0; background: {{t.soft}}; color: {{t.ink}}; font: 500 15px system-ui, sans-serif">Print a week</button>
      </div>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{t.muted}}"><strong style="color: {{t.ink}}">Limitations.</strong> The Gospels only, with no Old Testament or letters. Readings follow the order of the books, not a harmony of the four accounts.</p>
      <p style="margin: 0; font-size: 14px; line-height: 1.5; color: {{t.muted}}"><strong style="color: {{t.ink}}">Source.</strong> An original Day by Word plan, built from verse counts and estimated reading time. Reviewed: [review level and date].</p>
    </aside>
  </main>
  <footer>
    <p style="max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 18px 40px; font-size: 14px; color: {{t.muted}}">Day by Word is independent and not affiliated with any church or denomination. · In development.</p>
  </footer>
</div>
</figure>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3580,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const light = { key: 'l', label: 'Light', bg: '#FBFBFA', card: '#FFFFFF', ink: '#15171C', muted: '#596070', line: '#E7E8EC', soft: '#F1F2F5', tint: '#FFF0E5', dawn: '#B9531A', onDawn: '#FFFFFF' };
const dark = { key: 'd', label: 'Dark', bg: '#0D1117', card: '#161B23', ink: '#F1F3F6', muted: '#A0A8B6', line: '#262D38', soft: '#222935', tint: '#2E2118', dawn: '#F4A26A', onDawn: '#1B0F06' };
const week = [
{ n: 'Reading 1', ref: 'Matthew 1' },
{ n: 'Reading 2', ref: 'Matthew 2' },
{ n: 'Reading 3', ref: 'Matthew 3:1–4:11' },
{ n: 'Reading 4', ref: 'Matthew 4:12–5:16' },
{ n: 'Reading 5', ref: 'Matthew 5:17–48' },
{ n: 'Reading 6', ref: 'Matthew 6' }
];
return { phones: [light, dark], desks: [light, dark], week: week, phoneWeek: week.slice(0, 4) };
}
}
</script>
</body>
</html>
