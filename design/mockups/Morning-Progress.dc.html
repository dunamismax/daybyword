<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Morning · Progress</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:inherit}a:hover{opacity:.8}
</style>
</helmet>
<div style="width: 3580px; height: 1000px; box-sizing: border-box; padding: 40px; background: #ECECEA; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; display: flex; gap: 40px; align-items: flex-start">

<sc-for list="{{phones}}" as="t" hint-placeholder-count="2">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 15px; font-weight: 600; color: #3A3A3A">Phone · {{t.label}}</figcaption>
<div style="width: 390px; height: 844px; border-radius: 44px; overflow: hidden; box-sizing: border-box; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column">
  <header style="padding: 60px 24px 8px; display: flex; justify-content: space-between; align-items: center">
    <h1 style="margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -0.02em">Progress</h1>
    <button type="button" aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px dashed {{t.muted}}; background: transparent; color: {{t.muted}}; font-size: 9px">icon</button>
  </header>
  <main style="flex-grow: 1; overflow: hidden; padding: 8px 16px; display: flex; flex-direction: column; gap: 12px">
    <button type="button" style="align-self: flex-start; min-height: 44px; padding: 0 16px; border-radius: 22px; border: 0; background: {{t.soft}}; color: {{t.ink}}; font: 600 15px system-ui, sans-serif">Gospels at your pace ▾</button>
    <article style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 24px; padding: 18px 20px; display: flex; flex-direction: column; gap: 2px">
      <p style="margin: 0; font-size: 48px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">30</p>
      <p style="margin: 0; font-size: 16px">of [n] readings read</p>
      <p style="margin: 8px 0 0; font-size: 15px; color: {{t.muted}}">Next: <strong style="color: {{t.ink}}">Mark 4:1–20</strong></p>
    </article>
    <section aria-labelledby="mdays-{{t.key}}" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 24px; padding: 14px 16px">
      <h2 id="mdays-{{t.key}}" style="margin: 0 0 10px; font-size: 15px; font-weight: 700">This week</h2>
      <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; text-align: center">
        <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
        <li aria-label="{{d.spoken}}" style="display: flex; flex-direction: column; gap: 4px; padding: 8px 0; border-radius: 16px; background: {{t.soft}}"><span style="font-size: 12px; color: {{t.muted}}">{{d.day}}</span><span style="font-size: 17px; font-weight: 700">{{d.mark}}</span></li>
        </sc-for>
      </ol>
      <p style="margin: 8px 0 0; font-size: 13px; color: {{t.muted}}">✓ read · ◐ part read · – no reading</p>
    </section>
    <p style="margin: 0; padding: 14px 18px; border-radius: 24px; background: {{t.tint}}; font-size: 16px; font-weight: 600">You finished Matthew.</p>
    <section aria-labelledby="mbooks-{{t.key}}" style="padding: 0 6px">
      <h2 id="mbooks-{{t.key}}" style="margin: 0 0 4px; font-size: 15px; font-weight: 700">Books in this plan</h2>
      <ul style="margin: 0; padding: 0; list-style: none; font-size: 15px">
        <sc-for list="{{books}}" as="b" hint-placeholder-count="4">
        <li style="display: flex; justify-content: space-between; padding: 5px 0"><span style="font-weight: 600">{{b.name}}</span><span style="color: {{t.muted}}">{{b.state}}</span></li>
        </sc-for>
      </ul>
    </section>
  </main>
  <nav aria-label="Sections" style="margin: 0 16px 28px; border-radius: 28px; background: {{t.card}}; border: 1px solid {{t.line}}; padding: 6px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
    <a href="#today" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.muted}}; font-size: 12px; padding: 7px 0"><span aria-hidden="true" style="width: 22px; height: 22px; border: 1px dashed {{t.muted}}; border-radius: 6px"></span>Today</a>
    <a href="#plans" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; color: {{t.muted}}; font-size: 12px; padding: 7px 0"><span aria-hidden="true" style="width: 22px; height: 22px; border: 1px dashed {{t.muted}}; border-radius: 6px"></span>Plans</a>
    <a href="#progress" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 3px; text-decoration: none; border-radius: 22px; background: {{t.tint}}; color: {{t.ink}}; font-size: 12px; font-weight: 600; padding: 7px 0"><span aria-hidden="true" style="width: 22px; height: 22px; border: 1px dashed {{t.ink}}; border-radius: 6px"></span>Progress</a>
  </nav>
</div>
</figure>
</sc-for>

<sc-for list="{{desks}}" as="t" hint-placeholder-count="2">
<figure style="margin: 0; display: flex; flex-direction: column; gap: 12px">
<figcaption style="font-size: 15px; font-weight: 600; color: #3A3A3A">Desktop · {{t.label}}</figcaption>
<div style="width: 1280px; height: 860px; border-radius: 12px; overflow: hidden; box-sizing: border-box; border: 1px solid {{t.line}}; background: {{t.bg}}; color: {{t.ink}}; display: flex; flex-direction: column">
  <header>
    <div style="max-width: 1120px; margin: 0 auto; padding: 22px 40px; display: flex; justify-content: space-between; align-items: center">
      <a href="#home" style="display: flex; align-items: center; gap: 12px; text-decoration: none"><span aria-hidden="true" style="width: 30px; height: 30px; border: 1px dashed {{t.muted}}; border-radius: 9px"></span><span style="font-size: 20px; font-weight: 700; letter-spacing: -0.01em">Day by Word</span></a>
      <nav aria-label="Sections" style="display: flex; gap: 6px; font-size: 15px; background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 24px; padding: 4px">
        <a href="#today" style="text-decoration: none; color: {{t.muted}}; padding: 9px 18px">Today</a>
        <a href="#plans" style="text-decoration: none; color: {{t.muted}}; padding: 9px 18px">Plans</a>
        <a href="#progress" aria-current="page" style="text-decoration: none; font-weight: 600; padding: 9px 18px; border-radius: 20px; background: {{t.tint}}">Progress</a>
        <a href="#settings" style="text-decoration: none; color: {{t.muted}}; padding: 9px 18px">Settings</a>
      </nav>
    </div>
  </header>
  <main style="flex-grow: 1; overflow: hidden; width: 100%; max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 30px 40px; display: flex; flex-direction: column; gap: 20px">
    <div style="display: flex; justify-content: space-between; align-items: center">
      <h1 style="margin: 0; font-size: 44px; font-weight: 700; letter-spacing: -0.02em">Progress</h1>
      <button type="button" style="min-height: 44px; padding: 0 18px; border-radius: 22px; border: 0; background: {{t.soft}}; color: {{t.ink}}; font: 600 15px system-ui, sans-serif">Gospels at your pace ▾</button>
    </div>
    <div style="display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 20px; align-items: start">
      <div style="display: flex; flex-direction: column; gap: 16px">
        <article style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 28px; padding: 26px 28px; display: flex; flex-direction: column; gap: 4px">
          <p style="margin: 0; font-size: 68px; font-weight: 700; letter-spacing: -0.03em; line-height: 1">30</p>
          <p style="margin: 0; font-size: 18px">of [n] readings read</p>
          <p style="margin: 10px 0 0; font-size: 16px; color: {{t.muted}}">Next: <strong style="color: {{t.ink}}">Mark 4:1–20</strong></p>
        </article>
        <p style="margin: 0; padding: 16px 22px; border-radius: 24px; background: {{t.tint}}; font-size: 17px; font-weight: 600">You finished Matthew.</p>
        <section aria-labelledby="dmbooks-{{t.key}}" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 28px; padding: 18px 24px">
          <h2 id="dmbooks-{{t.key}}" style="margin: 0 0 4px; font-size: 17px; font-weight: 700">Books in this plan</h2>
          <ul style="margin: 0; padding: 0; list-style: none; font-size: 15px">
            <sc-for list="{{books}}" as="b" hint-placeholder-count="4">
            <li style="display: flex; justify-content: space-between; padding: 6px 0"><span style="font-weight: 600">{{b.name}}</span><span style="color: {{t.muted}}">{{b.state}}</span></li>
            </sc-for>
          </ul>
        </section>
      </div>
      <div style="display: flex; flex-direction: column; gap: 16px">
        <section aria-labelledby="dmdays-{{t.key}}" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 28px; padding: 20px 24px">
          <h2 id="dmdays-{{t.key}}" style="margin: 0 0 12px; font-size: 17px; font-weight: 700">This week</h2>
          <ol style="margin: 0; padding: 0; list-style: none; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 8px; text-align: center">
            <sc-for list="{{days}}" as="d" hint-placeholder-count="7">
            <li aria-label="{{d.spoken}}" style="display: flex; flex-direction: column; gap: 6px; padding: 12px 0; border-radius: 18px; background: {{t.soft}}"><span style="font-size: 13px; color: {{t.muted}}">{{d.day}}</span><span style="font-size: 20px; font-weight: 700">{{d.mark}}</span></li>
            </sc-for>
          </ol>
          <p style="margin: 10px 0 0; font-size: 13px; color: {{t.muted}}">✓ read · ◐ part read · – no reading</p>
        </section>
        <section aria-labelledby="dmhist-{{t.key}}" style="background: {{t.card}}; border: 1px solid {{t.line}}; border-radius: 28px; padding: 18px 24px">
          <div style="display: flex; justify-content: space-between; align-items: baseline">
            <h2 id="dmhist-{{t.key}}" style="margin: 0 0 4px; font-size: 17px; font-weight: 700">History</h2>
            <a href="#log" style="font-size: 15px; font-weight: 600; color: {{t.dawn}}; text-decoration: none">Log an earlier day</a>
          </div>
          <ol style="margin: 0; padding: 0; list-style: none">
            <sc-for list="{{history}}" as="h" hint-placeholder-count="5">
            <li style="display: grid; grid-template-columns: 110px 1fr auto; gap: 12px; padding: 7px 0; font-size: 15px"><span style="color: {{t.muted}}">{{h.date}}</span><span style="font-weight: 600">{{h.ref}}</span><span>{{h.state}}</span></li>
            </sc-for>
          </ol>
        </section>
        <p style="margin: 0; font-size: 14px; color: {{t.muted}}">Streak: off. Turn it on in <a href="#settings" style="text-underline-offset: 3px">Settings</a> if you want one.</p>
      </div>
    </div>
  </main>
  <footer>
    <p style="max-width: 1120px; margin: 0 auto; box-sizing: border-box; padding: 18px 40px; font-size: 14px; color: {{t.muted}}">Day by Word is independent and not affiliated with any church or denomination. · In development.</p>
  </footer>
</div>
</figure>
</sc-for>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":3580,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const light = { key: 'l', label: 'Light', bg: '#FBFBFA', card: '#FFFFFF', ink: '#15171C', muted: '#596070', line: '#E7E8EC', soft: '#F1F2F5', tint: '#FFF0E5', dawn: '#B9531A' };
const dark = { key: 'd', label: 'Dark', bg: '#0D1117', card: '#161B23', ink: '#F1F3F6', muted: '#A0A8B6', line: '#262D38', soft: '#222935', tint: '#2E2118', dawn: '#F4A26A' };
const days = [
{ day: 'Sat', mark: '◐', spoken: 'Saturday, part read' },
{ day: 'Sun', mark: '–', spoken: 'Sunday, no reading' },
{ day: 'Mon', mark: '✓', spoken: 'Monday, read' },
{ day: 'Tue', mark: '✓', spoken: 'Tuesday, read' },
{ day: 'Wed', mark: '–', spoken: 'Wednesday, no reading' },
{ day: 'Thu', mark: '✓', spoken: 'Thursday, read' },
{ day: 'Fri', mark: '·', spoken: 'Friday, today, not read yet' }
];
const books = [
{ name: 'Matthew', state: 'Finished' },
{ name: 'Mark', state: 'Chapters 1–3' },
{ name: 'Luke', state: 'Not yet' },
{ name: 'John', state: 'Not yet' }
];
const history = [
{ date: 'Thu 29 Oct', ref: 'Mark 3:20–35', state: '✓ Read' },
{ date: 'Wed 28 Oct', ref: '–', state: 'No reading' },
{ date: 'Tue 27 Oct', ref: 'Mark 3:1–19', state: '✓ Read' },
{ date: 'Mon 26 Oct', ref: 'Mark 2', state: '✓ Read, logged later' },
{ date: 'Sat 24 Oct', ref: 'Mark 1:21–45', state: '◐ Part read' }
];
return { phones: [light, dark], desks: [light, dark], days: days, books: books, history: history };
}
}
</script>
</body>
</html>
