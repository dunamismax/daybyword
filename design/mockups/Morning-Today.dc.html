      <div style="display: flex; flex-direction: column; gap: 16px">

<script type="text/x-dc" data-dc-script data-props='{"refSize":{"editor":"range","default":38,"min":24,"max":64,"step":1,"unit":"px"},"$preview":{"width":3580,"height":1000}}'>
class Component extends DCLogic {
renderVals() {
const light = { label: 'Light', bg: '#FBFBFA', card: '#FFFFFF', ink: '#15171C', muted: '#596070', line: '#E7E8EC', soft: '#F1F2F5', tint: '#FFF0E5', dawn: '#B9531A', onDawn: '#FFFFFF' };
const dark = { label: 'Dark', bg: '#0D1117', card: '#161B23', ink: '#F1F3F6', muted: '#A0A8B6', line: '#262D38', soft: '#222935', tint: '#2E2118', dawn: '#F4A26A', onDawn: '#1B0F06' };
const size = this.props.refSize ?? 38;
return { phones: [light, dark], desks: [light, dark], refPhone: size, refDesk: Math.round(size * 1.9) };
}
}
</script>
